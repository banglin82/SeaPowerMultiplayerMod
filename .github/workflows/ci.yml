name: CI

# Hosted runners cannot build the mod itself: it compiles against the game's own
# assemblies (Seapower-Scripts, Unity, BepInEx), which are not redistributable.
# This only checks that the Launcher still compiles. Build the mod locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Launcher
        run: dotnet build Launcher/SeapowerMultiplayer.Launcher.csproj -c Release
